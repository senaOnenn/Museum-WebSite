<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dönem Eserleri - Sanal Dünya Müzesi</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- BEYZA'NIN DÖNEMLERE ÖZEL DİNAMİK ARKA PLAN KODU - GÜNCEL -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const urlParams = new URLSearchParams(window.location.search);
        const periodId = urlParams.get('id');
        const heroSection = document.querySelector('.hero-section');

        const donemResimleri = {
            "ancient": "resimler/dene11.jpg",
            "medieval": "resimler/21.jpg",   /* BURAYI medieval YAPTIK */
            "renaissance": "resimler/dene11.jpg",
            "modern": "resimler/32.jpg"
        };

        if (periodId && donemResimleri[periodId] && heroSection) {
            heroSection.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.4)), url('${donemResimleri[periodId]}')`;
        }
    });
</script>

<script src="app.js"></script>

<body>

    <a href="#main-content" class="skip-link">İçeriğe Atla</a>

    <header class="main-header">
        <nav class="nav-container">
            <div class="logo">DÖNEMLERİN İZİNDE</div>
            <ul class="nav-links">
                <li><a href="index.html">Koleksiyonlar</a></li>
                <li><a href="about.html">Hakkında</a></li>
            </ul>
        </nav>
    </header>


    <main id="main-content">
        <section class="hero-section">
            <!-- YENİ BUTON YERİ BURASI -->
            <div class="back-navigation" style="text-align: left; padding: 0 40px; margin-bottom: 30px;">
                <a href="index.html" class="btn-kesfet btn-back">
                    <i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön
                </a>
            </div>

            <div id="period-header-info">
                <h1>Yükleniyor...</h1>
                <p>Seçilen döneme ait eserler hazırlanıyor.</p>
            </div>
        </section>


        <section class="container">
            <!-- Ebrar: Statik içerik temizlendi, grid app.js ile dolacak -->
            <div id="artifact-grid" class="grid-container"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 3rem;"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Sanal Dünya Müzesi | Ekip: Sena, Ebrar, Beyza</p>
            <div class="footer-links">
                <a href="about.html">Hakkında</a> |
                <a href="sources.html">Kaynakça</a>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
